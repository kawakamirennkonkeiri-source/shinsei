<!-- 株式会社カワカミ蓮根 申請承認アプリ  index.html  ver1.0  2026-08-20 -->
<!-- Apps Script では このファイルを「index」という名前のHTMLファイルとして貼ってください -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>カワカミ蓮根 申請</title>
<style>
  :root{
    --g:#2f7a3d; --g2:#256330; --bg:#f4f6f2; --card:#fff; --line:#dfe4da;
    --tx:#1d2420; --sub:#6a736c; --warn:#e08a00; --bad:#c0392b; --ok:#2f7a3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:17px;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 100px}
  header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 14px;
    display:flex;align-items:center;gap:10px}
  header .t{font-weight:700;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header button{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:15px;
    padding:7px 12px;border-radius:9px;font-weight:600}
  .langs{display:flex;gap:6px;justify-content:center;padding:10px 0 4px}
  .langs button{flex:1;padding:11px 4px;border:2px solid var(--line);background:#fff;border-radius:11px;
    font-size:15px;font-weight:600;color:var(--sub)}
  .langs button.on{border-color:var(--g);background:#eaf3ea;color:var(--g2)}
  h2{font-size:20px;margin:18px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
  .big{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:18px 16px;margin:10px 0;text-align:left;font-size:19px;font-weight:700;color:var(--tx);
    display:flex;align-items:center;gap:14px}
  .big .em{font-size:30px;line-height:1}
  .big .sub{display:block;font-size:14px;font-weight:500;color:var(--sub);margin-top:2px}
  .big .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;
    min-width:30px;padding:3px 10px;text-align:center;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 10px;
    font-size:15px;font-weight:700;color:var(--tx);min-height:96px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.35}
  .grid button .em{font-size:26px}
  .grid button .sub{font-size:11px;font-weight:500;color:var(--sub)}
  label{display:block;font-weight:700;margin:16px 0 6px;font-size:16px}
  label .sub{display:block;font-weight:500;font-size:13px;color:var(--sub)}
  label .req{color:var(--bad);font-size:13px;margin-left:4px}
  input,select,textarea{width:100%;padding:13px;border:2px solid var(--line);border-radius:11px;
    font-size:17px;background:#fff;color:var(--tx);font-family:inherit}
  textarea{min-height:88px}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g)}
  .chk{display:flex;align-items:flex-start;gap:10px;padding:11px;border:2px solid var(--line);
    border-radius:11px;margin:6px 0;background:#fff;font-size:15px;font-weight:500}
  .chk input{width:24px;height:24px;flex:0 0 24px;margin:1px 0 0}
  .note{background:#fff8e6;border:1px solid #f0d79a;border-radius:11px;padding:11px;
    font-size:14px;color:#6b5300;white-space:pre-wrap;margin:10px 0}
  .btn{display:block;width:100%;border:0;border-radius:13px;padding:17px;font-size:19px;
    font-weight:700;color:#fff;background:var(--g);margin:14px 0 0}
  .btn.gray{background:#8a938c}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .item{background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);
    border-radius:12px;padding:12px;margin:9px 0}
  .item.w{border-left-color:var(--warn)} .item.b{border-left-color:var(--bad)}
  .item.o{border-left-color:var(--ok)}
  .item .h{font-weight:700;font-size:17px}
  .item .m{font-size:14px;color:var(--sub);margin-top:3px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
    background:#eef2ec;color:var(--sub);margin-right:5px}
  .tag.w{background:#fdf0d5;color:#8a5b00}.tag.b{background:#fbe4e1;color:#a5281a}
  .tag.o{background:#e4f0e5;color:var(--g2)}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .stat div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}
  .stat b{display:block;font-size:26px;color:var(--g2)}
  .stat span{font-size:12px;color:var(--sub)}
  .kv{font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
  .kv b{flex:0 0 42%;font-weight:600;color:var(--sub)}
  .kv span{flex:1;white-space:pre-wrap;word-break:break-word}
  .pin{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
  .pin button{padding:19px 0;font-size:24px;font-weight:700;background:#fff;border:2px solid var(--line);
    border-radius:13px;color:var(--tx)}
  .dots{text-align:center;font-size:36px;letter-spacing:12px;margin:14px 0 0;min-height:44px;color:var(--g2)}
  .search{margin:8px 0 12px}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .names button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 8px;
    font-size:15px;font-weight:600;color:var(--tx);line-height:1.3}
  .names button.ap{border-color:var(--g);background:#eaf3ea}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:#1d2420;color:#fff;
    padding:14px 20px;border-radius:12px;font-size:16px;z-index:99;max-width:90%;text-align:center;
    opacity:0;pointer-events:none;transition:.2s}
  #toast.on{opacity:.96}
  .demo{background:#fbe4e1;color:#a5281a;font-size:13px;font-weight:700;padding:8px;text-align:center}
  .alert{background:#fbe4e1;border:2px solid #c0392b;border-radius:14px;padding:14px;margin:12px 0;
    color:#a5281a;font-weight:700;font-size:17px;line-height:1.5}
  .alert .btn{padding:14px;font-size:17px;margin:0}
  .hint{font-size:13px;color:var(--sub);margin:6px 0 0}
</style>

<header>
  <div class="t" id="hTitle">カワカミ蓮根 申請</div>

/* データのやり取り先。画面はGoogleの外（GitHub Pages）に置き、ここへ投げる。
   Cookieを送らない通信なので、Googleに複数アカウントでログインしていても影響を受けない。
   デプロイをやり直してURLが変わったら API を差し替える。TOKEN は Code.gs の API_TOKEN と必ず同じにする。 */
var API   = 'https://script.google.com/macros/s/AKfycbzHhCxNy0gyfXFrUusENS4Un3qjdv4cWqlMbIOKP8mMMkJZmCpCObyCDDNiJkjeRbU7/exec';
var TOKEN = 'kr-20260826-03f9d6e24fbd';
/* URLの末尾に ?demo=1 を付けたときだけ、架空データのお試し表示になる */
var DEMO  = (!API) || /[?&]demo=1(?:&|$)/.test(location.search);
var BOOT = null;          // {employees, approvers, config, today}
var ME = null;            // {name, dept, isApprover, title, tier}
var VIEW = [];            // 画面スタック
var CUR = null;           // 表示中フォーム

function $(id){ return document.getElementById(id); }
function el(h){ var d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ var t=$('toast'); t.textContent=m; t.className='on';
  setTimeout(function(){ t.className=''; },2600); }

function call(fn, args, cb){
  if(DEMO) return setTimeout(function(){ cb(demo(fn,args)); },140);
  // Content-Type を text/plain にすると事前確認の通信が発生せず、そのまま通る
  fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({token:TOKEN, fn:fn, args:args||[]})
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(!j || !j.ok){ toast((j&&j.msg)||'通信エラー'); return; }
    cb(j.data);
  })
  .catch(function(e){ toast('つながりませんでした。電波を確かめてもう一度ためしてください'); });
}

/* ---------- 起動 ---------- */
window.onload = function(){
  if(DEMO){ $('demoBar').style.display='block'; seedDemo(); }
  $('app').innerHTML = '<p style="text-align:center;padding:40px 0;color:#6a736c">'+T(UI.loading)+'</p>';
  call('api_bootstrap',[],function(b){
    BOOT = b;
    var saved = localStorage.getItem('kr_me');
    if(saved){ try{ ME = JSON.parse(saved); }catch(e){} }
    ME ? go('home') : go('login');
  });
};

function go(v,arg){ VIEW.push([v,arg]); render(); }
function back(){ if(VIEW.length>1){ VIEW.pop(); render(); } }
function reset(v){ VIEW=[[v,null]]; render(); }
function logout(){ ME=null; localStorage.removeItem('kr_me'); reset('login'); }

function render(){
  var cur = VIEW[VIEW.length-1];
  $('hBack').style.display = VIEW.length>1 ? '' : 'none';
  $('hOut').style.display  = (ME && VIEW.length===1) ? '' : 'none';
  $('hTitle').textContent  = ME ? (ME.name + (ME.title?'（'+ME.title+'）':'')) : 'カワカミ蓮根 申請';
  var f = { login:vLogin, pin:vPin, home:vHome, types:vTypes, form:vForm,
            mine:vMine, inbox:vInbox, detail:vDetail, dash:vDash, board:vBoard }[cur[0]];
  $('app').innerHTML=''; f(cur[1]);
  window.scrollTo(0,0);
}
function put(h){ $('app').appendChild(typeof h==='string'?el('<div>'+h+'</div>'):h); }

    box.innerHTML='';
    BOOT.employees.filter(function(e){
      return !q || (e.name+e.roman+e.dept).replace(/\s/g,'').toLowerCase().indexOf(q.toLowerCase())>=0;

        '<span style="display:block;font-size:11px;font-weight:400;color:#6a736c">'+esc(e.dept)+'</span></button>');

        if(isAp) go('pin',e.name);

               localStorage.setItem('kr_me',JSON.stringify(ME)); reset('home'); }

      box.appendChild(b);

  inp.oninput=draw; draw();

/* スタート画面の滞留アラート。中身は出さず「誰に何件か」だけ。 */
function waitBanner(){
  var box = el('<div id="wb"></div>'); put(box);
  call('api_board',[],function(d){
    if(!d || d.off) return;
    var w = (d.rank||[]).filter(function(x){ return x.count>0; });
    if(!w.length){
      box.innerHTML='<div style="background:#eaf3ea;border:1px solid #b9d6bd;border-left:6px solid #2f7a3d;'+
        'border-radius:11px;padding:12px 14px;margin:0 0 14px;color:#245c2c;font-size:14px">✅ '+T(UI.waitNone)+'</div>';
      return;
    }
    var hot = w.some(function(x){ return x.max>=3; });
    var bg  = hot?'#fdecea':'#fff8e6', bd = hot?'#f3b6ae':'#f0d79a';
    var bar = hot?'#c0392b':'#e08a00', fg = hot?'#8e2b20':'#6b5300';
    var h='<div style="background:'+bg+';border:1px solid '+bd+';border-left:6px solid '+bar+';'+
      'border-radius:11px;padding:13px 15px;margin:0 0 14px;color:'+fg+'">'+
      '<div style="font-weight:700;font-size:16px;margin-bottom:8px">⏰ '+T(UI.waitHead)+'</div>';
    w.forEach(function(x){
      var mark = x.max>=5?'🚨':(x.max>=3?'⚠':'');
      h+='<div style="font-size:16px;font-weight:700;margin:5px 0;line-height:1.5">'+mark+esc(x.name)+(lang==='ja'?' さん':'')+
         '　<span style="font-weight:400;font-size:14px">'+x.count+T(UI.cases)+
         '（'+T(UI.longest)+' '+x.max+T(UI.days)+'）</span></div>';
    });
    h+='<div style="font-size:13px;line-height:1.6;margin-top:9px;opacity:.9">'+T(UI.waitCall)+'</div></div>';
    box.innerHTML=h;
  });
}

/* ---------- 2. PIN ---------- */
function vPin(name){
  put('<h2>'+esc(name)+'</h2>');
  put('<p>'+T(UI.pin)+'</p>');
  var dots = el('<div class="dots"></div>'); put(dots);
  var buf='';
  function show(){ dots.textContent = buf; }   // 社員番号は桁数がちがうのでそのまま出す
  var pad = el('<div class="pin"></div>');
  ['1','2','3','4','5','6','7','8','9','←','0','OK'].forEach(function(c){
    var b = el('<button>'+c+'</button>');
    b.onclick=function(){
      if(c==='←'){ buf=buf.slice(0,-1); show(); return; }
      if(c==='OK'){
        call('api_loginApprover',[name,buf],function(r){
          if(r.ok){ ME={name:r.name,dept:'',isApprover:true,title:r.title,tier:r.tier};
            localStorage.setItem('kr_me',JSON.stringify(ME)); reset('home'); }
          else { toast(r.msg); buf=''; show(); }
        });
        return;
      }
      if(buf.length<8){ buf+=c; show(); }
    };
    pad.appendChild(b);
  });
  put(pad);
  put('<p class="hint">承認者7名だけ、他の人が勝手に承認できないように番号を入れます。<br>'+
      '初期値は社員番号です。変えたいときは スプレッドシートの「承認者」シートのPIN列を直してください。</p>');
}

/* 設定「申請ボタンを出さない人」に名前があれば［申請する］を出さない（承認だけする人） */
function noSubmit(name){
  var v=(BOOT.config||{})['申請ボタンを出さない人']||'';
  var k=String(name||'').replace(/s/g,'');
  return String(v).split(',').map(function(x){return x.replace(/s/g,'');})
    .filter(function(x){return x;}).indexOf(k)>=0;
}

function vForm(key){

  var wrapEl = el('<div></div>');

    var id='f_'+fl.k;
    var lab = '<label for="'+id+'">'+esc(T(fl))+
      (fl.req?'<span class="req">※必須</span>':'')+
      ((lang!=='ja'&&fl.ja&&T(fl)!==fl.ja)?'<span class="sub">'+esc(fl.ja)+'</span>':'')+'</label>';
    var body='';
    if(fl.t==='select'){
      var loc = (fl.oL && fl.oL[lang]) ? fl.oL[lang] : null;
      body='<select id="'+id+'"><option value=""></option>'+
        fl.o.map(function(o,i){
          var show = loc ? (loc[i]+'（'+o+'）') : o;      // 現地語（日本語）で併記
          return '<option value="'+esc(o)+'">'+esc(show)+'</option>';
        }).join('')+'</select>';
    } else if(fl.t==='area'){
      body='<textarea id="'+id+'"></textarea>';
    } else if(fl.t==='checks'){
      body=fl.o.map(function(o,i){
        return '<label class="chk"><input type="checkbox" id="'+id+'_'+i+'" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>';
      }).join('');
    } else if(fl.t==='check'){
      body='<label class="chk"><input type="checkbox" id="'+id+'"><span>'+esc(T(fl))+'</span></label>';
    } else {
      var ty = fl.t==='date'?'date' : fl.t==='datetime'?'datetime-local' :
               fl.t==='time'?'time' : fl.t==='num'?'number' : 'text';
      body='<input type="'+ty+'" id="'+id+'"'+(fl.ph?' placeholder="'+esc(fl.ph)+'"':'')+
           (fl.t==='num'?' inputmode="decimal"':'')+'>';
    }
    wrapEl.appendChild(el('<div>'+(fl.t==='check'?'':lab)+body+'</div>'));
  });
  put(wrapEl);

  var btn = el('<button class="btn">'+T(UI.send)+'</button>');
  btn.onclick=function(){ submit(F,btn); };
  put(btn);
}

function collect(F){
  var out=[], amt=0, miss=null, val={};
  // 先に全部の値を読む（reqIf で他の項目を見るため）
  F.f.forEach(function(fl){
    var id='f_'+fl.k;
    if(fl.t==='checks'){
      var a=[]; fl.o.forEach(function(o,i){ var c=$(id+'_'+i); if(c&&c.checked) a.push(o); });
      val[fl.k]=a.join(' / '); val['__n_'+fl.k]=a.length;
    } else if(fl.t==='check'){
      var c2=$(id); val[fl.k]=(c2&&c2.checked)?'はい':'';
    } else {
      var e=$(id); val[fl.k]=e?String(e.value||'').trim():'';
    }
  });
  F.f.forEach(function(fl){
    var v=val[fl.k];
    var need = fl.req || (fl.reqIf && val[fl.reqIf.k]===fl.reqIf.v);
    if(need && !miss){
      if(fl.t==='checks'){ if(val['__n_'+fl.k] < fl.o.length) miss=T(fl); }
      else if(!v) miss=T(fl);
    }
    if(fl.amt) amt += Number(String(v).replace(/[^0-9.\-]/g,''))||0;
    out.push({k:fl.k, label:fl.ja||T(fl), value:v});
  });
  return {fields:out, amount:amt, miss:miss};
}

function submit(F,btn){
  var c = collect(F);
  if(c.miss){ toast('「'+c.miss+'」'+T(UI.need)); return; }
  var map={}; c.fields.forEach(function(x){ map[x.k]=x.value; });
  var summary = (F.sum||[]).map(function(k){return map[k];}).filter(Boolean).join(' / ');
  btn.disabled=true; btn.textContent='…';
  call('api_submit',[{empName:ME.name, type:F.k, summary:summary,
                      amount:c.amount, fields:c.fields}], function(r){
    btn.disabled=false; btn.textContent=T(UI.send);
    if(!r||!r.ok){ toast((r&&r.msg)||'送信できませんでした'); return; }
    /* 承認者が「なし」の人（執行役など）は、出した時点で受付完了 */
    toast(r.done ? '出しました（'+r.id+'）承認は不要です。記録に残りました'
                 : T(UI.sent)+'（'+r.id+'）→ '+r.boss+' さんへ');
    reset('mine');
  });
}

function stateInfo(r){
  if(r.state==='承認待ち') return {cls:r.stayDays>=5?'b':r.stayDays>=3?'w':'', txt:T(UI.waitB)+'：'+r.boss};
  if(r.state==='2段目の承認待ち') return {cls:r.stayDays>=5?'b':r.stayDays>=3?'w':'', txt:T(UI.waitE)+'：'+r.exec};
  if(r.state==='承認済み')     return {cls:'o', txt:T(UI.done)};
  if(r.state==='差戻し')       return {cls:'b', txt:T(UI.back2)};

function vDetail(r){
  put('<h2>'+esc(r.type)+'</h2>');

  put('<div class="card"><span class="tag '+s.cls+'">'+esc(s.txt)+'</span>'+

      '<div class="kv"><b>申請日時</b><span>'+esc(r.submitted)+'</span></div>'+
      /* 承認者が空の申請は「承認不要」で完了しているので、そう見せる */
      '<div class="kv"><b>承認者</b><span>'+(r.boss
          ? esc(r.boss)+(r.bossAt?'　'+esc(r.bossAt):'　未')
          : '承認不要'+(r.bossAt?'　'+esc(r.bossAt):''))+
        (r.bossComment?'\n'+esc(r.bossComment):'')+'</span></div>'+
      (r.exec?'<div class="kv"><b>2段目</b><span>'+esc(r.exec)+(r.execAt?'　'+esc(r.execAt):'　未')+
        (r.execComment?'\n'+esc(r.execComment):'')+'</span></div>':'')+
      (Number(r.amount)?'<div class="kv"><b>金額</b><span>'+Number(r.amount).toLocaleString()+' 円</span></div>':'')+
      '</div>');

  var c = el('<div class="card"></div>');
  (r.fields||[]).forEach(function(f){
    if(!f.value) return;
    c.appendChild(el('<div class="kv"><b>'+esc(f.label)+'</b><span>'+esc(f.value)+'</span></div>'));
  });
  if(c.children.length) put(c);

  var canAct = ME.isApprover &&
    ((r.state==='承認待ち' && (eqn(r.boss)||eqn(r.exec)||ME.tier==='代表')) ||
     (r.state==='2段目の承認待ち' && (eqn(r.exec)||ME.tier==='代表')));
  if(!canAct) return;

  put('<label>'+T(UI.cm)+'</label>');
  var cm = el('<textarea id="cmt"></textarea>'); put(cm);

  var ok = el('<button class="btn">✅ '+T(UI.ok)+'</button>');
  ok.onclick=function(){ decide(r,'approve',cm.value,ok); };
  put(ok);
  var ng = el('<button class="btn bad">↩ '+T(UI.ng)+'</button>');
  ng.onclick=function(){
    if(!cm.value.trim()){ toast('差戻しの理由を書いてください'); cm.focus(); return; }
    decide(r,'reject',cm.value,ng);
  };
  put(ng);
}
function eqn(a){ return String(a||'').replace(/\s/g,'')===String(ME.name||'').replace(/\s/g,''); }

function decide(r,act,cm,btn){
  btn.disabled=true; var old=btn.textContent; btn.textContent='…';
  call('api_decide',[r.id,ME.name,act,cm],function(res){
    btn.disabled=false; btn.textContent=old;
    if(!res||!res.ok){ toast((res&&res.msg)||'できませんでした'); return; }
    toast(act==='approve'?('承認しました → '+res.state):'差戻しました');
    reset('inbox');
  });
}

function dstore(){ try{ return JSON.parse(localStorage.getItem('kr_demo')||'[]'); }catch(e){ return []; } }
function dsave(a){ localStorage.setItem('kr_demo',JSON.stringify(a)); }
function dnorm(s){ return String(s||'').replace(/\s/g,''); }
function ddays(iso){ var a=new Date(iso),b=new Date(),n=0; a.setHours(0,0,0,0); b.setHours(0,0,0,0);
  while(a<b){ a.setDate(a.getDate()+1); var w=a.getDay(); if(w!==0&&w!==6) n++; } return n; }

function demo(fn,args){
  if(fn==='api_bootstrap') return {employees:DEMO_EMP,approvers:DEMO_APR,
    config:{'ビザ申請フォームURL':'https://docs.google.com/forms/d/e/1FAIpQLSdwBANu62SvVK9u0TTrSHpZw3whRkSeF39Sof0cIQf6kI8ElQ/viewform',
            '申請ボタンを出さない人':'見本　社長,見本　専務'},today:''};
  if(fn==='api_loginApprover'){
    // お試し用の架空PIN。本物の社員番号は「承認者」シートにあり、照合はサーバー側でやる
    var pins={'見本　社長':'1','見本　専務':'2','見本　センター執行役':'3','見本　営業執行役':'4',
              '見本　広島所長':'5','見本　生産執行役':'6','見本　経理執行役':'7'};
    var a=DEMO_APR.filter(function(x){return dnorm(x.name)===dnorm(args[0]);})[0];
    if(!a) return {ok:false,msg:'承認者ではありません'};
    if(String(args[1])!==pins[a.name]) return {ok:false,msg:'PINが違います（デモは'+pins[a.name]+'）'};
    return {ok:true,name:a.name,title:a.title,depts:a.depts,tier:a.tier};
  }
  if(fn==='api_submit'){
    var p=args[0], all=dstore();
    var e=DEMO_EMP.filter(function(x){return dnorm(x.name)===dnorm(p.empName);})[0]||{dept:'',site:'',no:'',boss:'見本　専務'};
    var exec = (p.type==='一時帰国希望申請書'||Number(p.amount)>=100000)
      ? '見本　社長' : '見本　専務';
    var r={id:'D-'+('000'+(all.length+1)).slice(-4), submitted:new Date().toISOString().slice(0,16).replace('T',' '),
      _at:new Date().toISOString(), type:p.type, applicant:p.empName, empNo:e.no, dept:e.dept, site:e.site,
      boss:e.boss, exec:'', state:'承認待ち', bossAt:'', bossComment:'', execAt:'', execComment:'',
      summary:p.summary, amount:p.amount, fields:p.fields};
    all.push(r); dsave(all);
    return {ok:true,id:r.id,boss:r.boss,exec:r.exec};
  }
  var all=dstore().map(function(r){
    r.stayDays=(r.state==='承認待ち'||r.state==='2段目の承認待ち')?ddays(r._bossAt||r._at):0;
    r.leadDays=0; return r;
  });
  if(fn==='api_myList') return all.filter(function(r){return dnorm(r.applicant)===dnorm(args[0]);});
  if(fn==='api_inbox'){
    var k=dnorm(args[0]);
    return {waiting: all.filter(function(r){
        return (r.state==='承認待ち'&&dnorm(r.boss)===k)||(r.state==='2段目の承認待ち'&&dnorm(r.exec)===k);}),
      related: all.filter(function(r){ return dnorm(r.boss)===k||dnorm(r.exec)===k; })};
  }
  if(fn==='api_decide'){
    var raw=dstore(), t=null;
    raw.forEach(function(r){ if(r.id===args[0]) t=r; });
    if(!t) return {ok:false,msg:'見つかりません'};
    // 本番のCode.gsと同じ判定：承認者本人か、2段目の人か、代表だけが押せる
    var kk=dnorm(args[1]);
    if(kk!==dnorm(t.boss) && kk!==dnorm(t.exec) && kk!==dnorm('見本　社長'))
      return {ok:false,msg:'この申請の承認者ではありません'};
    var now=new Date().toISOString();
    if(args[2]==='reject'){ t.state='差戻し'; t.bossComment='差戻し: '+(args[3]||''); }
    else if(t.state==='承認待ち'){
      t.bossAt=now.slice(0,16).replace('T',' '); t._bossAt=now; t.bossComment=args[3]||'';
      if(!t.exec || dnorm(t.exec)===dnorm(args[1])){ t.state='承認済み'; t.execAt=t.bossAt; }
      else t.state='2段目の承認待ち';
    } else if(t.state==='2段目の承認待ち'){
      t.state='承認済み'; t.execAt=now.slice(0,16).replace('T',' '); t.execComment=args[3]||'';
    }
    dsave(raw);
    return {ok:true,state:t.state};
  }
  if(fn==='api_board'){
    var op=all.filter(function(r){return r.state==='承認待ち'||r.state==='2段目の承認待ち';});
    var bb={};
    DEMO_APR.forEach(function(a){ bb[a.name]={name:a.name,title:a.title,count:0,max:0,over3:0,over5:0}; });
    op.forEach(function(r){ var w=(r.state==='承認待ち')?r.boss:r.exec;
      bb[w]=bb[w]||{name:w,title:'',count:0,max:0,over3:0,over5:0};
      bb[w].count++; bb[w].max=Math.max(bb[w].max,r.stayDays);
      if(r.stayDays>=3) bb[w].over3++; if(r.stayDays>=5) bb[w].over5++; });
    return {rank:Object.keys(bb).map(function(k){return bb[k];})
        .sort(function(a,b){return (b.max-a.max)||(b.count-a.count);}),
      total:op.length, over3:op.filter(function(r){return r.stayDays>=3;}).length, escDays:5};
  }
  if(fn==='api_dashboard'){
    var open=all.filter(function(r){return r.state==='承認待ち'||r.state==='2段目の承認待ち';});
    var by={};
    open.forEach(function(r){ var w=(r.state==='承認待ち')?r.boss:r.exec;
      by[w]=by[w]||{name:w,count:0,days:0,max:0,over:0};
      by[w].count++; by[w].days+=r.stayDays; by[w].max=Math.max(by[w].max,r.stayDays);
      if(r.stayDays>=3) by[w].over++; });
    var rank=Object.keys(by).map(function(k){var b=by[k];b.avg=Math.round(b.days/b.count*10)/10;return b;})
      .sort(function(a,b){return b.max-a.max;});
    return {open:open.sort(function(a,b){return b.stayDays-a.stayDays;}), rank:rank,
      stats:{openCount:open.length,over3:open.filter(function(r){return r.stayDays>=3;}).length,
        over5:open.filter(function(r){return r.stayDays>=5;}).length,
        doneThisMonth:all.filter(function(r){return r.state==='承認済み';}).length, avgLead:0}};
  }
  return {ok:false,msg:'demo: '+fn};
}
</script>
