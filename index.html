<!-- 株式会社カワカミ蓮根 申請承認アプリ  index.html  ver1.1  2026-09-24 改良版 -->
<!-- パフォーマンス改善：キャッシング＆即座UI フィードバック -->
<!-- Apps Script では このファイルを「index」という名前のHTMLファイルとして貼ってください -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>カワカミ蓮根 申請</title>
<style>
  :root{
    --g:#2f7a3d; --g2:#256330; --bg:#f4f6f2; --card:#fff; --line:#dfe4da;
    --tx:#1d2420; --sub:#6a736c; --warn:#e08a00; --bad:#c0392b; --ok:#2f7a3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:17px;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 100px}
  header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 14px;
    display:flex;align-items:center;gap:10px}
  header .t{font-weight:700;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header button{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:15px;
    padding:7px 12px;border-radius:9px;font-weight:600}
  .langs{display:flex;gap:6px;justify-content:center;padding:10px 0 4px}
  .langs button{flex:1;padding:11px 4px;border:2px solid var(--line);background:#fff;border-radius:11px;
    font-size:15px;font-weight:600;color:var(--sub)}
  .langs button.on{border-color:var(--g);background:#eaf3ea;color:var(--g2)}
  h2{font-size:20px;margin:18px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
  .big{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:18px 16px;margin:10px 0;text-align:left;font-size:19px;font-weight:700;color:var(--tx);
    display:flex;align-items:center;gap:14px}
  .big .em{font-size:30px;line-height:1}
  .big .sub{display:block;font-size:14px;font-weight:500;color:var(--sub);margin-top:2px}
  .big .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;
    min-width:30px;padding:3px 10px;text-align:center;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 10px;
    font-size:15px;font-weight:700;color:var(--tx);min-height:96px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.35}
  .grid button .em{font-size:26px}
  .grid button .sub{font-size:11px;font-weight:500;color:var(--sub)}
  label{display:block;font-weight:700;margin:16px 0 6px;font-size:16px}
  label .sub{display:block;font-weight:500;font-size:13px;color:var(--sub)}
  label .req{color:var(--bad);font-size:13px;margin-left:4px}
  input,select,textarea{width:100%;padding:13px;border:2px solid var(--line);border-radius:11px;
    font-size:17px;background:#fff;color:var(--tx);font-family:inherit}
  textarea{min-height:88px}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g)}
  .chk{display:flex;align-items:flex-start;gap:10px;padding:11px;border:2px solid var(--line);
    border-radius:11px;margin:6px 0;background:#fff;font-size:15px;font-weight:500}
  .chk input{width:24px;height:24px;flex:0 0 24px;margin:1px 0 0}
  .note{background:#fff8e6;border:1px solid #f0d79a;border-radius:11px;padding:11px;
    font-size:14px;color:#6b5300;white-space:pre-wrap;margin:10px 0}
  .btn{display:block;width:100%;border:0;border-radius:13px;padding:17px;font-size:19px;
    font-weight:700;color:#fff;background:var(--g);margin:14px 0 0}
  .btn.gray{background:#8a938c}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .item{background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);
    border-radius:12px;padding:12px;margin:9px 0}
  .item.w{border-left-color:var(--warn)} .item.b{border-left-color:var(--bad)}
  .item.o{border-left-color:var(--ok)}
  .item .h{font-weight:700;font-size:17px}
  .item .m{font-size:14px;color:var(--sub);margin-top:3px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
    background:#eef2ec;color:var(--sub);margin-right:5px}
  .tag.w{background:#fdf0d5;color:#8a5b00}.tag.b{background:#fbe4e1;color:#a5281a}
  .tag.o{background:#e4f0e5;color:var(--g2)}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .stat div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}
  .stat b{display:block;font-size:26px;color:var(--g2)}
  .stat span{font-size:12px;color:var(--sub)}
  .kv{font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
  .kv b{flex:0 0 42%;font-weight:600;color:var(--sub)}
  .kv span{flex:1;white-space:pre-wrap;word-break:break-word}
  .pin{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
  .pin button{padding:19px 0;font-size:24px;font-weight:700;background:#fff;border:2px solid var(--line);
    border-radius:13px;color:var(--tx)}
  .dots{text-align:center;font-size:36px;letter-spacing:12px;margin:14px 0 0;min-height:44px;color:var(--g2)}
  .search{margin:8px 0 12px}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .names button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 8px;
    font-size:15px;font-weight:600;color:var(--tx);line-height:1.3}
  .names button.ap{border-color:var(--g);background:#eaf3ea}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:#1d2420;color:#fff;
    padding:14px 20px;border-radius:12px;font-size:16px;z-index:99;max-width:90%;text-align:center;
    opacity:0;pointer-events:none;transition:.2s}
  #toast.on{opacity:.96}
  .demo{background:#fbe4e1;color:#a5281a;font-size:13px;font-weight:700;padding:8px;text-align:center}
  .alert{background:#fbe4e1;border:2px solid #c0392b;border-radius:14px;padding:14px;margin:12px 0;
    color:#a5281a;font-weight:700;font-size:17px;line-height:1.5}
  .alert .btn{padding:14px;font-size:17px;margin:0}
  .hint{font-size:13px;color:var(--sub);margin:6px 0 0}
  /* === パフォーマンス改善：スケルトンスクリーン === */
  .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
    background-size:200% 100%;animation:shimmer 1.5s infinite;height:20px;border-radius:4px;margin:10px 0}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);
    border-top-color:var(--g);border-radius:50%;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>

<header>
  <div class="t" id="hTitle">カワカミ蓮根 申請</div>
  <button id="hBack" style="display:none" onclick="back()">戻る</button>
  <button id="hOut" style="display:none" onclick="logout()">交代</button>
</header>
<div class="demo" id="demoBar" style="display:none">お試し表示　この端末の中だけ・他の人には届きません</div>
<div class="wrap" id="app"></div>
<div id="toast"></div>

<script>
/* =============================================================
 *  多言語
 * ============================================================= */
var LANGS = [['日本語','ja'],['Tiếng Việt','vi'],['Bahasa','id']];
var lang = localStorage.getItem('kr_lang') || 'ja';

/* 多言語テキスト（省略） */
var UI = {
  loading:'読み込み中...',
  newReq:'新しい申請',
  newReqS:'作成',
  mine:'自分の申請',
  mineS:'確認',
  inbox:'確認待ち',
  inboxS:'承認',
  board:'みんなの状況',
  boardS:'確認',
  dash:'ダッシュボード',
  dashS:'分析',
  none:'なし',
  boardNone:'承認待ちはすべて終了',
  banner:'⚠ 3営業日以上、確認待ちのまま',
  cases:'件',
  longest:'最長',
  days:'日',
  bannerGo:'確認する'
};

function T(s){ return s; }

var API = 'https://script.google.com/macros/s/AKfycbzHhCxNy0gyfXFrUusENS4Un3qjdv4cWqlMbIOKP8mMMkJZmCpCObyCDDNiJkjeRbU7/exec';  // ← Apps ScriptのデプロイURL
var TOKEN = 'kr-20260826-03f9d6e24fbd';
var DEMO  = (!API) || /[?&]demo=1(?:&|$)/.test(location.search);
var BOOT = null;
var ME = null;
var VIEW = [];
var CUR = null;

/* === パフォーマンス改善：キャッシュ機能 === */
var CACHE = {};
var CACHE_TTL = {
  'api_inbox': 120000,      // 2分
  'api_board': 300000,       // 5分
  'api_dashboard': 300000,   // 5分
  'api_myList': 120000       // 2分
};

function $(id){ return document.getElementById(id); }
function el(h){ var d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ var t=$('toast'); t.textContent=m; t.className='on';
  setTimeout(function(){ t.className=''; },2600); }

/* === 改良版：キャッシング付き call() === */
function call(fn, args, cb, useCache){
  var cacheKey = fn + JSON.stringify(args);
  var now = Date.now();

  // キャッシュ確認
  if(useCache && CACHE[cacheKey] && (now - CACHE[cacheKey].time) < (CACHE_TTL[fn] || 60000)){
    // キャッシュが有効 → 即座に返す
    setTimeout(function(){ cb(CACHE[cacheKey].data); }, 0);
    // バックグラウンドで最新データを取得（ユーザーには見えない）
    fetchInBackground(fn, args, cacheKey);
    return;
  }

  // キャッシュなし、または有効期限切れ → API呼び出し
  if(DEMO){
    return setTimeout(function(){ cb(demo(fn,args)); }, 140);
  }

  fetchInBackground(fn, args, cacheKey);
}

function fetchInBackground(fn, args, cacheKey){
  fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({token:TOKEN, fn:fn, args:args||[]})
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(!j || !j.ok){ toast((j&&j.msg)||'通信エラー'); return; }
    // キャッシュに保存
    CACHE[cacheKey] = {
      data: j.data,
      time: Date.now()
    };
  })
  .catch(function(e){ toast('つながりませんでした。電波を確かめてもう一度ためしてください'); });
}

function seedDemo(){
  if(localStorage.getItem('kr_demo')!==null) return;
  function ago(d){ var t=new Date(); t.setDate(t.getDate()-d); return t.toISOString(); }
  function fmt(iso){ return iso.slice(0,16).replace('T',' '); }
  var s=[
    {id:'D-0001',_at:ago(12),type:'社用車使用申請書',applicant:'見本　生産社員',dept:'生産',site:'熊本',
     boss:'見本　生産執行役',exec:'',state:'承認待ち',summary:'熊本→広島 出荷応援',amount:0,
     fields:[{k:'purpose',label:'使用目的',value:'東広島事業所へ出荷の応援に行くため'},
             {k:'dest',label:'目的地',value:'東広島事業所'},{k:'car',label:'車種',value:'ハイエース'}]},
    {id:'D-0002',_at:ago(7),type:'残業申請書',applicant:'見本　センター社員',dept:'センター',site:'熊本',
     boss:'見本　センター執行役',exec:'',state:'承認待ち',summary:'17:30 / 2時間 / ヘルプ',amount:0,
     fields:[{k:'time',label:'予定時間（残業を始める時間）',value:'17:30'},
             {k:'hours',label:'予定 時間数',value:'2時間'},{k:'reason',label:'残業理由',value:'ヘルプ'}]},
    {id:'D-0003',_at:ago(9),_bossAt:ago(2),bossAt:fmt(ago(2)),bossComment:'確認しました',
     type:'一時帰国希望申請書',applicant:'MIHON A',dept:'生産',site:'熊本',
     boss:'見本　社長',exec:'',state:'承認待ち',summary:'12/1 〜 1/10 家族の結婚式',amount:0,
     fields:[{k:'purpose',label:'帰国目的（脱退一時金の期間も書いてください）',value:'妹の結婚式に出るため'},
             {k:'taishoku',label:'退職の有無',value:'無'},
             {k:'talked',label:'職長に相談して許可をもらいました',value:'はい'}]},
    {id:'D-0004',_at:ago(2),type:'有給休暇届',applicant:'MIHON A',dept:'生産',site:'熊本',
     boss:'見本　生産執行役',exec:'',state:'承認待ち',summary:'年次有給休暇 / 9/10 〜 9/11 / 2',amount:0,
     fields:[{k:'kubun',label:'休暇区分',value:'年次有給休暇'},{k:'days',label:'日数',value:'2'}]}
  ];
  s.forEach(function(r){ r.submitted=fmt(r._at); });
  localStorage.setItem('kr_demo',JSON.stringify(s));
}

window.onload = function(){
  if(DEMO){ $('demoBar').style.display='block'; seedDemo(); }
  $('app').innerHTML = '<p style="text-align:center;padding:40px 0;color:#6a736c">'+T(UI.loading)+'</p>';
  call('api_bootstrap',[],function(b){
    BOOT = b;
    var saved = localStorage.getItem('kr_me');
    if(saved){ try{ ME = JSON.parse(saved); }catch(e){} }
    ME ? go('home') : go('login');
  });
};

function go(v,arg){ VIEW.push([v,arg]); render(); }
function back(){ if(VIEW.length>1){ VIEW.pop(); render(); } }
function reset(v){ VIEW=[[v,null]]; render(); }
function logout(){ ME=null; localStorage.removeItem('kr_me'); reset('login'); }

function render(){
  var cur = VIEW[VIEW.length-1];
  $('hBack').style.display = VIEW.length>1 ? '' : 'none';
  $('hOut').style.display  = (ME && VIEW.length===1) ? '' : 'none';
  $('hTitle').textContent  = ME ? (ME.name + (ME.title?'（'+ME.title+'）':'')) : 'カワカミ蓮根 申請';
  var f = { login:vLogin, pin:vPin, home:vHome, types:vTypes, form:vForm,
            mine:vMine, inbox:vInbox, detail:vDetail, dash:vDash, board:vBoard }[cur[0]];
  $('app').innerHTML=''; f(cur[1]);
  window.scrollTo(0,0);
}
function put(h){ $('app').appendChild(typeof h==='string'?el('<div>'+h+'</div>'):h); }

function langBar(){
  var d = el('<div class="langs"></div>');
  LANGS.forEach(function(L){
    var b = el('<button'+(lang===L[1]?' class="on"':'')+'>'+L[0]+'</button>');
    b.onclick=function(){ lang=L[1]; localStorage.setItem('kr_lang',lang); render(); };
    d.appendChild(b);
  });
  return d;
}

/* ==================== ログイン ==================== */
function vLogin(){
  put(langBar());
  put('<h2>あなたは誰ですか？</h2>');
  var search = el('<input class="search" type="text" placeholder="名前をさがす">');
  put(search);

  var list = el('<div class="names" id="nameList"></div>');
  put(list);

  if(BOOT && BOOT.employees){
    var emp = BOOT.employees;
    var filtered = emp;

    search.oninput = function(){
      var q = search.value.toLowerCase();
      filtered = q ? emp.filter(function(e){ return e.name.toLowerCase().includes(q); }) : emp;
      renderNames();
    };

    function renderNames(){
      list.innerHTML = '';
      filtered.forEach(function(e){
        var b = el('<button>'+esc(e.name)+'<span class="sub">'+esc(e.dept)+'</span></button>');
        b.onclick=function(){ selectEmployee(e); };
        list.appendChild(b);
      });
    }
    renderNames();
  }
}

function selectEmployee(emp){
  ME = {name:emp.name, dept:emp.dept, isApprover:false, title:''};
  localStorage.setItem('kr_me', JSON.stringify(ME));
  go('pin');
}

function vPin(){
  put('<h2>'+ME.name+'</h2>');
  put('<p style="font-size:14px;color:#6a736c">あなたの社員番号を入れてください</p>');

  var display = el('<div class="dots" id="pinDisplay">0</div>');
  var buf = '';
  put(display);

  var btnDiv = el('<div class="pin"></div>');
  for(var i=1; i<=9; i++){
    var b = el('<button>'+i+'</button>');
    b.onclick = (function(n){
      return function(){
        buf += n; update();
      };
    })(i);
    btnDiv.appendChild(b);
  }

  var bBack = el('<button>←</button>');
  bBack.onclick = function(){ buf = buf.slice(0,-1); update(); };
  btnDiv.appendChild(bBack);

  var b0 = el('<button>0</button>');
  b0.onclick = function(){ buf += '0'; update(); };
  btnDiv.appendChild(b0);

  var bOk = el('<button>OK</button>');
  bOk.style.gridColumn = 'span 1';
  bOk.onclick = function(){
    call('api_loginApprover',[ME.name,buf],function(r){
      if(r && r.isApprover){
        ME = r;
        localStorage.setItem('kr_me',JSON.stringify(ME));
        go('home');
      }else{
        toast('PINが違うか、承認者ではありません');
        buf=''; update();
      }
    });
  };
  btnDiv.appendChild(bOk);

  put(btnDiv);

  function update(){
    display.textContent = buf ? '●'.repeat(buf.length) : '0';
  }
}

function noSubmit(name){
  if(!BOOT || !BOOT.config) return false;
  return (BOOT.config.noSubmit||[]).indexOf(name) >= 0;
}

/* ==================== ホーム ==================== */
function vHome(){
  put(langBar());
  if(ME.isApprover) put('<div id="alertBox"></div>');
  var noSub = noSubmit(ME.name);
  if(!noSub){
    var b1 = el('<button class="big"><span class="em">📝</span><span>'+T(UI.newReq)+
      '<span class="sub">'+T(UI.newReqS)+'</span></span></button>');
    b1.onclick=function(){ go('types'); }; put(b1);

    var b2 = el('<button class="big"><span class="em">📋</span><span>'+T(UI.mine)+
      '<span class="sub">'+T(UI.mineS)+'</span></span></button>');
    b2.onclick=function(){ go('mine'); }; put(b2);
  }

  if(ME.isApprover){
    var b3 = el('<button class="big"><span class="em">✅</span><span>'+T(UI.inbox)+
      '<span class="sub">'+T(UI.inboxS)+'</span></span><span class="bd" id="bdg">…</span></button>');
    b3.onclick=function(){ go('inbox'); }; put(b3);
    // キャッシュを使用 → 即座に表示（バックグラウンドで更新）
    call('api_inbox',[ME.name],function(r){
      var w=(r.waiting||[]), e=$('bdg');
      if(e){ if(w.length) e.textContent=w.length; else e.style.display='none'; }
      var late=w.filter(function(x){return x.stayDays>=3;});
      var box=$('alertBox');
      if(box && late.length){
        var worst=Math.max.apply(null,late.map(function(x){return x.stayDays;}));
        box.innerHTML='<div class="alert">⚠ '+T(UI.banner)+'<br>'+
          late.length+T(UI.cases)+'　'+T(UI.longest)+' '+worst+T(UI.days)+
          '<button class="btn bad" style="margin-top:10px">'+T(UI.bannerGo)+'</button></div>';
        box.querySelector('button').onclick=function(){ go('inbox'); };
      }
    }, true);  // ← useCache=true でキャッシュ機能を有効化
  }

  var b5 = el('<button class="big"><span class="em">👀</span><span>'+T(UI.board)+
    '<span class="sub">'+T(UI.boardS)+'</span></span></button>');
  b5.onclick=function(){ go('board'); }; put(b5);

  if(ME.isApprover){
    var b4 = el('<button class="big"><span class="em">📊</span><span>'+T(UI.dash)+
      '<span class="sub">'+T(UI.dashS)+'</span></span></button>');
    b4.onclick=function(){ go('dash'); }; put(b4);
  }

  if(DEMO){
    var rb = el('<button class="btn gray" style="font-size:16px;padding:13px">'+
      'お試しデータを消してまっさらにする</button>');
    rb.onclick=function(){
      localStorage.removeItem('kr_demo'); seedDemo();
      toast('お試しデータを入れ直しました'); reset('home');
    };
    put(rb);
    put('<p class="hint">お試し表示です。入れた申請はこの端末の中だけに残り、他の人には届きません。'+
        '本番はGoogleスプレッドシートにつないで、7人が同じ状況を見られるようになります。</p>');
  }
}

/* ==================== 受信箱 ==================== */
function vInbox(){
  put('<h2>✅ '+T(UI.inbox)+'</h2>');
  var box=el('<div>'+T(UI.loading)+'</div>'); put(box);
  call('api_inbox',[ME.name],function(r){
    box.innerHTML='';
    if(!r || !r.waiting || !r.waiting.length){
      box.appendChild(el('<div class="card">すべて確認済みです 🎉</div>'));
      return;
    }
    r.waiting.forEach(function(x){
      var item=el('<div class="item '+
        (x.stayDays>=3?'b':x.stayDays>=1?'w':'o')+'">'+
        '<div class="h">'+esc(x.type)+'</div>'+
        '<div class="m">'+esc(x.applicant)+' - '+esc(x.summary)+'<br>'+
        x.stayDays+'日待機</div></div>');
      item.onclick=function(){ go('detail',x); };
      box.appendChild(item);
    });
  }, true);  // ← useCache=true
}

/* ==================== ボード（みんなの承認状況） ==================== */
function vBoard(){
  put('<h2>👀 '+T(UI.board)+'</h2>');
  var box=el('<div>'+T(UI.loading)+'</div>'); put(box);
  call('api_board',[],function(d){
    box.innerHTML='';
    if(!d || d.off){ box.innerHTML='<div class="card">'+T(UI.none)+'</div>'; return; }
    if(!d.total){ box.appendChild(el('<div class="card">'+T(UI.boardNone)+' 🎉</div>')); }
    if(d.rank){
      d.rank.forEach(function(x){
        var cls = x.max>=5?'b' : x.max>=3?'w' : (x.count?'':'o');
        box.appendChild(el('<div class="item '+cls+'">'+
          '<div class="h">'+esc(x.name)+'</div>'+
          '<div class="m">待機: '+x.count+'件　最長: '+x.max+'日</div></div>'));
      });
    }
  }, true);  // ← useCache=true
}

/* ==================== ダッシュボード ==================== */
function vDash(){
  put('<h2>📊 '+T(UI.dash)+'</h2>');
  var box=el('<div>'+T(UI.loading)+'</div>'); put(box);
  call('api_dashboard',[],function(d){
    box.innerHTML='<div class="stat">'+
      '<div><b>'+d.total+'</b><span>全体件数</span></div>'+
      '<div><b>'+d.waiting+'</b><span>待機中</span></div>'+
      '</div>';
  }, true);  // ← useCache=true
}

function vForm(){ put('<p>フォーム</p>'); }
function vMine(){ put('<p>自分の申請</p>'); }

}
